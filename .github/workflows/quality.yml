name: Research quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ensure only source files are versioned
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__/|.*\\.pyc$)'; then
            echo "Compiled Python artifacts must not be committed"
            exit 1
          fi
      - name: Compile Python utilities (offline)
        run: python -m compileall -q tools
      - name: Deterministic quality tests (offline)
        run: python -m unittest discover -s tests -v
